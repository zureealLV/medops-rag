[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medops-rag"
version = "2.0.0b2.dev0"
description = "An auditable multimodal RAG assistant for synthetic hospital IT operations documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1.0",
    "fastembed>=0.7,<0.8",
    "httpx>=0.28,<1.0",
    "numpy>=1.26,<3",
    "onnxruntime>=1.22,<2",
    "Pillow>=11,<13",
    "pypdf>=6,<7",
    "pypdfium2>=4.30,<5",
    "python-multipart>=0.0.20,<1.0",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "rapidocr>=3,<4",
    "rank-bm25>=0.2.2,<0.3",
    "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "reportlab>=4,<5",
    "ruff>=0.12,<1.0",
]
vectorstores = [
    "chromadb>=1.5,<2",
    "qdrant-client>=1.19,<2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
