[project]
name = "medops-rag"
version = "0.1.0"
description = "An auditable RAG assistant for synthetic hospital IT operations documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8,<9",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
